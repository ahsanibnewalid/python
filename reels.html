<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reels · {{ site_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><script src="{{ url_for('static', filename='theme.js') }}"></script><style>
:root{--blue:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--line:#dddfe2;--soft:#f2f3f5}html[data-theme="dark"]{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;--soft:#3a3b3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.reels-top{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:var(--blue);font-size:22px}.reels-top nav{display:flex;gap:6px;margin:auto}.reels-top nav a{padding:12px 18px;border-radius:10px;color:var(--muted);font-weight:800;text-decoration:none}.reels-top nav a.active,.reels-top nav a:hover{background:#eaf2ff;color:var(--blue)}.reels-top .actions{display:flex;gap:8px}.circle{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--text);text-decoration:none}.reels-page{max-width:900px;margin:0 auto;padding:20px 14px 80px}.reel-card{position:relative;background:#050505;border-radius:18px;overflow:hidden;margin-bottom:18px;min-height:min(780px,calc(100dvh - 110px));display:flex;justify-content:center;align-items:center}.reel-card video{width:100%;height:100%;max-height:780px;object-fit:contain;background:#050505}.reel-overlay{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}.reel-author{display:flex;gap:10px;align-items:center}.reel-author img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #fff}.reel-author strong{display:block}.reel-author small{opacity:.8}.reel-caption{margin-top:10px;white-space:pre-line;line-height:1.45}.reel-actions{position:absolute;right:14px;bottom:24px;display:grid;gap:8px}.reel-action{width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-weight:900;cursor:pointer}.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted)}@media(max-width:760px){.reels-top{height:58px;padding:0 10px}.reels-top nav{display:none}.reels-top .brand{font-size:18px;flex:1}.reels-page{padding:0 0 76px}.reel-card{border-radius:0;margin:0 0 8px;min-height:calc(100dvh - 58px)}.reel-card video{height:calc(100dvh - 58px)}}
</style></head><body><header class="reels-top"><a class="brand" href="{{ url_for('user_home') }}">{{ site_name }}</a><nav><a href="{{ url_for('user_home') }}">Home</a><a class="active" href="{{ url_for('reels_page') }}">Reels</a><a href="{{ url_for('groups_page') }}">Groups</a><a href="{{ url_for('messages') }}">Messages</a></nav><div class="actions"><a class="circle" href="{{ url_for('my_profile') }}">👤</a><a class="circle" href="{{ url_for('user_home') }}">⌂</a></div></header><main class="reels-page">{% for r in reels %}<article class="reel-card"><video controls playsinline preload="metadata" src="{{ r.media_url }}"></video><div class="reel-overlay"><a class="reel-author" href="{{ r.profile_url }}"><img src="{{ url_for('static', filename='uploads/' + r.photo) }}"><span><strong>{{ r.name }}</strong><small>@{{ r.username or 'student' }}</small></span></a>{% if r.caption %}<div class="reel-caption">{{ r.caption }}</div>{% endif %}</div><div class="reel-actions"><button class="reel-action" onclick="likeReel({{ r.id }},this)">👍<span>{{ r.like_count }}</span></button><button class="reel-action" onclick="document.getElementById('comment-{{ r.id }}').focus()">💬<span>{{ r.comment_count }}</span></button></div></article>{% else %}<div class="empty"><h2>No reels yet</h2><p>Publish a video as a Reel from the Home composer.</p><a href="{{ url_for('user_home') }}#composer" style="color:var(--blue);font-weight:800">Create a Reel</a></div>{% endfor %}</main><script>const CSRF={{ csrf|tojson }};async function likeReel(id,b){const r=await fetch('/post/'+id+'/like',{method:'POST',headers:{'X-CSRF-Token':CSRF}});if(!r.ok)return;const d=await r.json();b.querySelector('span').textContent=d.like_count;b.style.color=d.liked?'#4ea1ff':'#fff'}</script>{% include 'mobile_nav.html' %}</body></html>
