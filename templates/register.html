<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fb;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#172033;padding:24px}.wrap{width:min(100%,620px);margin:auto}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.08)}h1{margin:0 0 7px}.sub{color:#667085;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}.hint{font-size:11px;color:#7b8490;margin-top:5px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#198754;color:#fff;font-weight:800;margin-top:18px}.flash{padding:11px;border-radius:10px;margin-bottom:12px;background:#fee2e2;color:#991b1b}.links{text-align:center;margin-top:18px}.links a{color:#1456c4;text-decoration:none;font-weight:700}@media(max-width:620px){body{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><main class="card"><h1>Join {{ site_name }}</h1><div class="sub">Use Gmail and a Bangladesh mobile number to register.</div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><div><label>Full name *</label><input name="name" required></div><div><label>Username *</label><input name="username" minlength="3" required></div><div><label>Gmail *</label><input type="email" name="gmail" placeholder="you@gmail.com" required></div><div><label>Phone number *</label><input name="phone" inputmode="tel" pattern="\+8801[3-9][0-9]{8}" placeholder="+8801712345678" required><div class="hint">Must start with +880, e.g. +8801712345678</div></div><div><label>Password *</label><input type="password" name="password" minlength="6" required></div><div><label>Confirm password *</label><input type="password" name="confirm_password" minlength="6" required></div><div class="full"><label>Profile photo</label><input type="file" name="photo" accept="image/*"></div></div><button class="btn" type="submit">Create Account</button></form><div class="links"><a href="{{ url_for('user_login') }}">Already have an account? Log in</a></div></main></div></body></html>
