<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance</title><link rel="stylesheet" href="{{ url_for('static',filename='theme.css') }}"><script src="{{ url_for('static',filename='theme.js') }}"></script><style>body{font-family:system-ui;background:#f3f6fa;margin:0;color:#172033}.wrap{max-width:720px;margin:30px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{padding:20px;border:2px solid #e5e7eb;border-radius:14px;cursor:pointer}.choice input{margin-right:7px}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><script src="{{ url_for('static', filename='theme.js') }}"></script></head><body>{% include 'return_nav.html' %}<main class="wrap"><div class="card"><h1>🎨 Appearance</h1><p>Choose the normal, dark or system theme. This preference is stored locally in your browser.</p><form id="appearanceForm" method="POST" action="{{ url_for('appearance_settings') }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="choices"><label class="choice"><input type="radio" name="theme" value="light">☀️ Light</label><label class="choice"><input type="radio" name="theme" value="dark">🌙 Dark</label><label class="choice"><input type="radio" name="theme" value="system">🖥 System</label></div><button type="submit" style="margin-top:14px;border:0;border-radius:10px;padding:11px 16px;background:#1877f2;color:white;font-weight:800;cursor:pointer">Save appearance</button></form><p><a href="{{ url_for('user_home') }}">← Back to home</a></p></div></main><script>
const saved=window.ucGetTheme?ucGetTheme():('{{ theme|default('system') }}'||'system');
document.querySelectorAll('[name=theme]').forEach(x=>{x.checked=x.value===saved;x.addEventListener('change',()=>ucSetTheme(x.value))});
document.getElementById('appearanceForm').addEventListener('submit',async e=>{
 e.preventDefault(); const form=e.currentTarget; const theme=form.querySelector('[name=theme]:checked')?.value||'system';
 ucSetTheme(theme);
 const fd=new FormData(form); fd.set('theme',theme);
 try{const r=await fetch(form.action,{method:'POST',body:fd,headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'}});
   if(!r.ok) throw new Error('Could not save appearance.');
   const d=await r.json().catch(()=>({}));
   if(d.ok!==true && r.redirected===false && !d.theme) throw new Error('Could not save appearance.');
   const btn=form.querySelector('button[type=submit]'); if(btn){const old=btn.textContent;btn.textContent='Saved ✓';setTimeout(()=>btn.textContent=old,1200)}
 }catch(err){alert(err.message); }
});
</script>{% include 'mobile_nav.html' %}<button class="uc-theme-toggle" type="button" onclick="ucSetTheme((localStorage.getItem('uc_theme')||'system')==='dark'?'light':'dark')" title="Toggle dark/light theme">🌓</button></body></html>
