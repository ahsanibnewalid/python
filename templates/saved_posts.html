<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved · {{ site_name }}</title><link rel="stylesheet" href="{{ url_for('static',filename='theme.css') }}"></head><body><main style="width:min(850px,calc(100% - 28px));margin:auto;padding:24px 0 80px"><div style="display:flex;justify-content:space-between;align-items:center"><h1>🔖 Saved</h1><a href="{{ url_for('my_dashboard') }}">← My Dashboard</a></div>{% if items %}<div style="display:grid;gap:12px">{% for p in items %}<article style="background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:14px;padding:14px"><b>{{ p.author_name }}</b><span style="color:#667085">@{{ p.author_username }}</span><p>{{ p.caption or 'Media post' }}</p>{% if p.media_url %}{% if p.media_type=='video' %}<video controls playsinline style="max-width:100%;max-height:500px" src="{{ p.media_url }}"></video>{% else %}<img loading="lazy" style="max-width:100%;max-height:500px;object-fit:contain" src="{{ p.media_url }}" alt="Saved post">{% endif %}{% endif %}<div style="margin-top:8px"><button type="button" onclick="unsave({{ p.id }},this)">Remove from saved</button></div></article>{% endfor %}</div>{% else %}<div style="padding:50px;text-align:center;color:#667085">Nothing saved yet.</div>{% endif %}</main><script>const csrf={{ csrf|tojson }};async function unsave(id,b){const r=await fetch('/api/posts/'+id+'/save',{method:'POST',headers:{'X-CSRF-Token':csrf,'X-Requested-With':'XMLHttpRequest'}});if(r.ok)b.closest('article').remove()}</script></body></html>
