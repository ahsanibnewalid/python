<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ code }} · {{ site_name }}</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;font-family:system-ui;color:#172033}.card{width:min(92%,520px);background:#fff;border-radius:20px;padding:36px;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.08)}.code{font-size:58px;font-weight:900;color:#1456c4}h1{margin:5px 0 10px}p{color:#667085}.btn{display:inline-block;margin-top:15px;padding:11px 16px;border-radius:10px;background:#1456c4;color:#fff;text-decoration:none;font-weight:800}</style><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><script src="{{ url_for('static', filename='theme.js') }}"></script></head><body><main class="card"><div class="code">{{ code }}</div><h1>{{ title }}</h1><p>{{ message }}</p><a class="btn" href="{{ url_for('home') if session.get('logged_in') else url_for('user_login') }}">Go back</a></main><button class="uc-theme-toggle" type="button" onclick="ucSetTheme((localStorage.getItem('uc_theme')||'system')==='dark'?'light':'dark')" title="Toggle dark/light theme">🌓</button></body></html>
