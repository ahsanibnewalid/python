<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}University Management{% endblock %}</title><style>body{font:16px system-ui;margin:0;background:#f3f6fb;color:#172033}header{background:#12213c;color:white;padding:16px 5%;display:flex;justify-content:space-between}header a{color:white;margin-right:12px}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #dce3ef;border-radius:14px;padding:22px;margin:14px 0}.narrow{max-width:480px;margin:45px auto}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4e1;border-radius:8px;box-sizing:border-box}button,.button{display:inline-block;background:#2457c5;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.item{padding:12px 0;border-bottom:1px solid #e7ebf2}.flash{padding:12px;background:#eaf1ff;margin:10px 0;border-radius:8px}.error{background:#fff0ef}.success{background:#e9f8ef}.muted{color:#637089;font-size:14px}.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}</style></head><body><header><b>🎓 University Management</b><nav>{% if current_user %}<a href="{{ url_for('dashboard') }}">Dashboard</a><form method="post" action="{{ url_for('logout') }}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Sign out</button></form>{% else %}<a href="{{ url_for('login') }}">Sign in</a> <a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header><main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
