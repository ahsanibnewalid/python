<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance</title><link rel="stylesheet" href="{{ url_for('static',filename='theme.css') }}"><script src="{{ url_for('static',filename='theme.js') }}"></script><style>body{font-family:system-ui;background:#f3f6fa;margin:0;color:#172033}.wrap{max-width:720px;margin:30px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #0001}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{padding:20px;border:2px solid #e5e7eb;border-radius:14px;cursor:pointer}.choice input{margin-right:7px}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><script src="{{ url_for('static', filename='theme.js') }}"></script></head><body>{% include 'return_nav.html' %}<main class="wrap"><div class="card"><h1>🎨 Appearance</h1><p>Choose the normal, dark or system theme. This preference is stored locally in your browser.</p><div class="choices"><label class="choice"><input type="radio" name="theme" value="light">☀️ Light</label><label class="choice"><input type="radio" name="theme" value="dark">🌙 Dark</label><label class="choice"><input type="radio" name="theme" value="system">🖥 System</label></div><p><a href="{{ url_for('user_home') }}">← Back to home</a></p></div></main><script>const saved=localStorage.getItem('uc_theme')||'system';document.querySelectorAll('[name=theme]').forEach(x=>{x.checked=x.value===saved;x.onchange=()=>ucSetTheme(x.value)});</script>{% include 'mobile_nav.html' %}<button class="uc-theme-toggle" type="button" onclick="ucSetTheme((localStorage.getItem('uc_theme')||'system')==='dark'?'light':'dark')" title="Toggle dark/light theme">🌓</button></body></html>
