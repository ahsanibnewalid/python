<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Administrator Password · {{ site_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"><style>body{margin:0;min-height:100vh;background:#f4f7fb;font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(15,23,42,.10)}h1{margin:0 0 8px}.lead{color:#64748b;line-height:1.5}.group{margin:17px 0}label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px}.actions{display:flex;gap:10px}.btn{flex:1;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#2563eb,#6366f1);color:#fff;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.flash{padding:12px;border-radius:10px;margin:12px 0}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}</style></head><body><main class="card"><h1>Change administrator credentials</h1><p class="lead">Current administrator: <b>{{ current_username }}</b>. The new password is stored as a secure hash in PostgreSQL.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="group"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" required autocomplete="current-password"></div><div class="group"><label for="username">Administrator username</label><input id="username" name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]{3,40}" value="{{ current_username }}" required autocomplete="username"></div><div class="group"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="12" required autocomplete="new-password"></div><div class="group"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password"></div><div class="actions"><a class="btn secondary" href="{{ url_for('home') }}">Cancel</a><button class="btn" type="submit">Save &amp; Sign Out</button></div></form></main></body></html>
