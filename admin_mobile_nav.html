<style>
.admin-mobile-nav{display:none}
.admin-more-sheet{display:none}
@media(max-width:760px){
  body{padding-bottom:76px!important}
  .admin-mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.98);
    border-top:1px solid #dfe4ea;box-shadow:0 -6px 20px rgba(15,23,42,.10);z-index:9999;
    align-items:stretch;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}
  .admin-mobile-nav a,.admin-mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;background:none!important;border:0!important;color:#475467!important;text-decoration:none;font:700 10px/1.1 Arial,sans-serif;
    padding:5px 2px!important;margin:0!important;min-width:0;cursor:pointer}
  .admin-mobile-nav a.active,.admin-mobile-nav button.active{color:#1456c4!important}
  .admin-mobile-icon{font-size:19px;line-height:1}
  .admin-more-sheet{position:fixed;left:12px;right:12px;bottom:76px;z-index:9998;background:#fff;border:1px solid #dfe4ea;
    border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.20);padding:10px}
  .admin-more-sheet a{display:block;padding:13px 12px;border-radius:10px;color:#172033;text-decoration:none;font-weight:700}
  .admin-more-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.20);z-index:9997}
  .admin-more-backdrop.open{display:block}
  .admin-more-sheet{display:none}
  .admin-more-sheet.open{display:block}
}
</style>
<div class="admin-more-backdrop" id="adminMoreBackdrop" onclick="toggleAdminMore(false)"></div>
<div class="admin-more-sheet" id="adminMoreSheet">
  <a href="{{ url_for('admin_campus') }}">🏫 Campus Management</a>
  <a href="{{ url_for('admin_users') }}">👥 User Management</a>
  <a href="{{ url_for('admin_analytics') }}">📊 Analytics</a>
  <a href="{{ url_for('activity_log') }}">🧾 Activity Log</a>
  <a href="{{ url_for('register') }}">➕ Register User</a>
  <a href="{{ url_for('logout') }}">↪ Log Out</a>
</div>
<nav class="admin-mobile-nav" aria-label="Admin mobile navigation">
  <a class="{% if request.endpoint in ['home'] %}active{% endif %}" href="{{ url_for('home') }}"><span class="admin-mobile-icon">🏠</span><span>Dashboard</span></a>
  <a class="{% if request.endpoint in ['activity_log'] %}active{% endif %}" href="{{ url_for('activity_log') }}"><span class="admin-mobile-icon">🧾</span><span>Activity</span></a>
  <a class="{% if request.endpoint in ['admin_campus'] %}active{% endif %}" href="{{ url_for('admin_campus') }}"><span class="admin-mobile-icon">🏫</span><span>Campus</span></a>
  <a class="{% if request.endpoint in ['admin_users'] %}active{% endif %}" href="{{ url_for('admin_users') }}"><span class="admin-mobile-icon">👥</span><span>Users</span></a>
  <button type="button" onclick="toggleAdminMore()"><span class="admin-mobile-icon">☰</span><span>More</span></button>
</nav>
<script>
function toggleAdminMore(force){
  const sheet=document.getElementById('adminMoreSheet'),backdrop=document.getElementById('adminMoreBackdrop');
  if(!sheet||!backdrop)return;const open=typeof force==='boolean'?force:!sheet.classList.contains('open');
  sheet.classList.toggle('open',open);backdrop.classList.toggle('open',open);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleAdminMore(false)});
</script>
