<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ site_name }} · User Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f7f8fb);font-family:system-ui,-apple-system,Segoe UI,Arial;color:#172033;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fff;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(0,0,0,.10)}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#667085;margin-bottom:24px}label{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d7dce5;border-radius:11px;font:inherit}button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:11px;background:#1456c4;color:#fff;font-weight:800;font-size:15px}.error{padding:11px;border-radius:10px;background:#fee2e2;color:#991b1b;text-align:center}.links{text-align:center;margin-top:18px}.links a{color:#1456c4;font-weight:700;text-decoration:none;margin:0 5px}.hint{text-align:center;color:#7b8490;font-size:12px;margin-top:13px}</style></head><body><main class="card"><h1>{{ site_name }}</h1><div class="sub">Welcome back to your student community</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="identifier">Gmail, phone number or username</label><input id="identifier" name="identifier" type="text" placeholder="you@gmail.com or +8801712345678" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" required><button type="submit">Log In</button></form><div class="links"><a href="{{ url_for('register') }}">Create account</a></div><div class="hint">Bangladesh phone numbers must start with +880.</div></main></body></html>
