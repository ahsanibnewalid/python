# University Connect Render blueprint: persistent Postgres + stateless web service.
services:
  - type: web
    name: university-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: university-connect-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: TRUST_PROXY
        value: "1"
      - key: REQUIRE_HTTPS
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: BILLING_ENABLED
        value: "false"
      - key: BILLING_PROVIDER
        value: none
      - key: MEDIA_STORAGE
        value: local
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_REGION
        value: auto
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
      - key: MEDIA_S3_PREFIX
        value: university-connect

databases:
  - name: university-connect-db
    databaseName: university_connect
    user: university_connect
    plan: free
