services:
  - type: web
    name: universityconnect
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-production.txt
    preDeployCommand: python -c "import app; app.init_db()"
    autoDeployTrigger: checksPass
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: REQUIRE_HTTPS
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: universityconnect-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SITE_NAME
        value: University Connect
      - key: STORAGE_ROOT
        value: /var/data
databases:
  - name: universityconnect-db
    plan: starter
