<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notifications · {{ site_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='university-connect.css') }}">
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--soft:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top-inner{width:min(1100px,calc(100% - 28px));margin:auto;height:64px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;text-decoration:none;color:inherit}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#6366f1);display:grid;place-items:center;color:#fff}
.back{margin-left:auto;padding:9px 12px;border-radius:10px;background:var(--soft);color:var(--blue);text-decoration:none;font-weight:800;font-size:12px}
.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 90px}
.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:15px}
.head h1{margin:0;font-size:28px;letter-spacing:-.03em}.head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.list{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:flex-start;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 24px rgba(15,23,42,.05);cursor:pointer}.item.unread{border-color:#bfdbfe;background:#f8fbff}
.icon{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:13px}.copy p{margin:4px 0;color:#334155;font-size:12px;line-height:1.55}.copy small{color:var(--muted);font-size:10px}.empty{padding:48px 18px;text-align:center;background:var(--card);border:1px dashed #cbd5e1;border-radius:16px;color:var(--muted)}
@media(max-width:600px){.wrap{padding-top:18px}.head h1{font-size:23px}.item{padding:13px}.copy p{font-size:11px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
<a class="brand" href="{{ url_for('user_home') }}"><span class="mark">🎓</span><span>University Connect</span></a>
<a class="back" href="{{ url_for('user_home') }}">← Back to feed</a>
</div></header>
<main class="wrap">
<section class="head"><div><h1>Notifications</h1><p>Assignments, moderation updates, reactions and platform activity.</p></div></section>
<section id="notificationList" class="list"><div class="empty">Loading notifications…</div></section>
</main>
<script>
const csrf={{ csrf_token()|tojson }};
const list=document.getElementById('notificationList');
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
async function markRead(id,el){
  try{
    await fetch('/platform/notifications/'+id+'/read',{method:'POST',headers:{'X-CSRF-Token':csrf,'X-Requested-With':'XMLHttpRequest'}});
    el.classList.remove('unread');
  }catch(e){}
}
async function load(){
  try{
    const r=await fetch('/api/notifications',{cache:'no-store'});
    if(!r.ok)throw new Error();
    const d=await r.json();
    const rows=d.notifications||[];
    if(!rows.length){list.innerHTML='<div class="empty">You are all caught up.</div>';return}
    list.innerHTML=rows.map(n=>'<article class="item '+(n.is_read?'':'unread')+'" data-id="'+Number(n.id)+'"><div class="icon">🔔</div><div class="copy"><strong>'+esc(n.title||'Notification')+'</strong><p>'+esc(n.body||'')+'</p><small>'+esc(n.created_at||'')+'</small></div></article>').join('');
    list.querySelectorAll('.item').forEach(el=>{
      el.addEventListener('click',async()=>{
        const id=Number(el.dataset.id); await markRead(id,el);
        const row=rows.find(x=>Number(x.id)===id);
        if(row?.url) location.href=row.url;
      });
    });
  }catch(e){list.innerHTML='<div class="empty">Notifications are temporarily unavailable. Refresh and try again.</div>'}
}
load();
</script>
</body>
</html>
