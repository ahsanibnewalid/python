services:
  - type: web
    name: university-management-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: university-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: university-management-db
    databaseName: university_management
    user: university_management_user
