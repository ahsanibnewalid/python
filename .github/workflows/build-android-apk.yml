name: Build Android APK

run-name: Android APK build ${{ inputs.request_id && format('· {0}', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Admin build request identifier"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: university-connect-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
